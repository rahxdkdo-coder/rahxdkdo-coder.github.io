<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b1f">
<meta name="robots" content="noindex,nofollow">
<title>Наша вселенная ✨</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="pwa/icon-180.png">
<link rel="icon" href="pwa/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Вселенная">
<meta property="og:title" content="✨ Только для двоих">
<meta property="og:description" content="Введи секретный код">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Manrope:wght@500;700;800&display=swap&subset=cyrillic" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#070b1f;overflow:hidden}
body{font-family:'Cormorant Garamond',Georgia,serif;color:#f6efe7;display:flex;align-items:center;justify-content:center;text-align:center;-webkit-font-smoothing:antialiased}
#sky{position:fixed;inset:0;background:radial-gradient(40% 30% at 15% 20%,rgba(120,70,180,.35),transparent 70%),radial-gradient(35% 30% at 85% 35%,rgba(240,120,160,.22),transparent 70%),linear-gradient(180deg,#070b1f,#0d1233 50%,#140f2e)}
canvas{position:fixed;inset:0;pointer-events:none}
.box{position:relative;z-index:2;padding:24px;width:min(420px,100%);transition:opacity .8s,transform .8s}
.box.out{opacity:0;transform:scale(1.1)}
.lock{width:76px;height:76px;margin:0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px;background:radial-gradient(circle at 40% 35%,rgba(255,223,158,.35),rgba(255,223,158,.05));border:1px solid rgba(255,223,158,.45);box-shadow:0 0 40px rgba(255,223,158,.25);animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 70px rgba(255,223,158,.5)}}
h1{font-family:'Marck Script',cursive;font-weight:400;font-size:clamp(52px,14vw,76px);line-height:1;margin-top:18px;background:linear-gradient(180deg,#fff7ea,#f3c77a 60%,#e08e6d);-webkit-background-clip:text;background-clip:text;color:transparent}
p{font-size:21px;font-style:italic;color:#c9bfd8;margin-top:10px;line-height:1.4}
input{width:100%;margin-top:28px;padding:16px 18px;border-radius:18px;border:1px solid rgba(255,223,158,.4);background:rgba(20,22,52,.6);color:#fff;font-family:Manrope,sans-serif;font-size:18px;text-align:center;letter-spacing:.08em;outline:none;transition:border-color .3s,box-shadow .3s}
input:focus{border-color:#ffdf9e;box-shadow:0 0 24px rgba(255,223,158,.3)}
button{margin-top:14px;width:100%;padding:16px;border:none;border-radius:999px;font-family:Manrope,sans-serif;font-size:16px;font-weight:800;color:#2a1a10;background:linear-gradient(135deg,#ffe3a8,#f3b86a);box-shadow:0 10px 34px rgba(243,199,122,.4);cursor:pointer}
button:disabled{opacity:.6}
.err{font-family:Manrope,sans-serif;font-size:14px;color:#ff9db8;margin-top:14px;min-height:20px}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.load{position:fixed;inset:0;z-index:3;display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px;font-family:Manrope,sans-serif;font-size:14px;color:#c9bfd8;letter-spacing:.06em}
.load i{width:46px;height:46px;border-radius:50%;border:3px solid rgba(255,223,158,.25);border-top-color:#ffdf9e;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="sky"></div><canvas id="cv"></canvas>
<div class="box" id="box">
  <div class="lock">🔐</div>
  <h1>Наша вселенная</h1>
  <p>Это место только для двоих.<br>Введи свой секретный код.</p>
  <form id="f" autocomplete="off"><input id="code" type="text" placeholder="секретный код" autocomplete="off" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false"><button id="go" type="submit">Открыть ✨</button></form>
  <div class="err" id="err"></div>
</div>
<div class="load" id="load"><i></i><span id="lt">открываем вашу вселенную…</span></div>
<script>
(function(){
var SLOTS=[{"w":"anya","i":"MImo8/4H+d9jEwk3","k":"pKm6sX44CdvRyJ6Csipju2jtF5ZK7GVvxi2QlQI9ENqr7Yep1oCwB18CfcDwTfvc"},{"w":"anya","i":"jf5+yhksO8H69zY8","k":"5ZCI9MQZPDyn7CeBtPjtykKJbOKUg/ksSupgZq1pM2n80p6yxFzxBPD6bfbrs7og"},{"w":"anya","i":"OAPv8sWYQOY9X6hi","k":"v/zml0N8E/WsG0A3rETE06xia8OI+NzXeONocl4QGMPgQwl7YbBjNh49s2ILgbsy"},{"w":"anya","i":"746LFz/pkzOsA1Z+","k":"howzGih5HbLtuE5pqsVPnxPdDaQw7ZvFc4L1XlM0FEHfI5tRV3camaoRyOdNlUhA"},{"w":"dan","i":"6q+BDfKRmwWC1+Ds","k":"w4NlekWhrLEQHzbUSIvjByxV0Rr/oc8uGCWqZgKkr6QJC+YlpSvgvzJAZLeURb0c"},{"w":"dan","i":"+NscfKMBiqPtepoi","k":"M1qQIYopMiG/EcuCR6ByRRomb95xAMkNiW/vh8A9fO7mSE0gI0c4ERtA1CZZ/VIJ"}],SALT='ggQjFZ2GBcfeXQST5I/DKw==',ITER=150000,IV='gf4dhFaY2hvEMOII',VER='mw80w8rm',SIZE=1615944;
var $=function(i){return document.getElementById(i)};
var cv=$('cv'),c=cv.getContext('2d'),W,H,st=[];
function sz(){W=innerWidth;H=innerHeight;var d=Math.min(devicePixelRatio||1,2);cv.width=W*d;cv.height=H*d;c.setTransform(d,0,0,d,0,0)}sz();addEventListener('resize',sz);
for(var i=0;i<160;i++)st.push({x:Math.random(),y:Math.random(),r:Math.random()*1.6+.3,t:Math.random()*6});
(function lp(){c.clearRect(0,0,W,H);st.forEach(function(s){s.t+=.03;c.fillStyle='rgba(255,255,255,'+(.4+.4*Math.sin(s.t))+')';c.beginPath();c.arc(s.x*W,s.y*H,s.r,0,6.283);c.fill()});requestAnimationFrame(lp)})();
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function ub64(u){var s='';for(var i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)}
function norm(s){return (s||'').toLowerCase().replace(/ё/g,'е').replace(/[\s.,!_\-]+/g,'')}
addEventListener('beforeinstallprompt',function(e){e.preventDefault();window.__bip=e});
if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js').catch(function(){})}catch(_){}}
var S=(window.crypto&&crypto.subtle)?crypto.subtle:null;
function err(t){$('err').innerHTML=t}
function setLoad(on,t){$('load').style.display=on?'flex':'none';if(t)$('lt').innerHTML=t;$('box').classList.toggle('out',!!on)}
/* загрузка с прогрессом и повторами */
var dl=null;
function download(){if(dl)return dl;dl=new Promise(function(res,rej){var tries=0;(function go(){tries++;var x=new XMLHttpRequest();x.open('GET','app.bin?v='+VER,true);x.responseType='arraybuffer';x.timeout=90000;
  x.onprogress=function(e){var tot=e.lengthComputable?e.total:SIZE;var p=Math.min(99,Math.round(e.loaded/tot*100));if($('load').style.display==='flex')$('lt').innerHTML='открываем вашу вселенную… '+p+'%'};
  x.onload=function(){if(x.status===200&&x.response&&x.response.byteLength>1000)res(new Uint8Array(x.response));else fail()};x.onerror=fail;x.ontimeout=fail;x.send();
  function fail(){if(tries<3)setTimeout(go,1500*tries);else{dl=null;rej('net')}}})()});return dl}
download().catch(function(){});
function openWith(raw,who){setLoad(true,'открываем вашу вселенную…');
  return download().then(function(t){return S.importKey('raw',raw,'AES-GCM',false,['decrypt']).then(function(k){return S.decrypt({name:'AES-GCM',iv:b64(IV)},k,t)}).catch(function(){throw 'dec'})})
  .then(function(buf){var html=new TextDecoder().decode(buf).replace("'%%WHO%%'","'"+who+"'").replace("'%%KEY%%'","'"+ub64(new Uint8Array(raw))+"'");document.open();document.write(html);document.close()})}
function fail(e){setLoad(false);var btn=$('go');btn.disabled=false;btn.textContent='Открыть ✨';
  if(e==='net')err('Не получилось загрузить — слабый интернет 📶<br>Подожди чуть-чуть и нажми «Открыть» ещё раз.');
  else if(e==='dec'){try{localStorage.removeItem('nv_k')}catch(_){}err('Сайт обновился — введи код ещё раз 💛')}
  else err('Что-то пошло не так. Попробуй открыть ссылку в Safari или Chrome 🙏')}
function tryCode(code){var n=new TextEncoder().encode(norm(code));return S.importKey('raw',n,'PBKDF2',false,['deriveKey']).then(function(base){
  return S.deriveKey({name:'PBKDF2',salt:b64(SALT),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt'])}).then(function(dk){
  return SLOTS.reduce(function(p,sl){return p.catch(function(){return S.decrypt({name:'AES-GCM',iv:b64(sl.i)},dk,b64(sl.k)).then(function(raw){return{raw:new Uint8Array(raw),who:sl.w}})})},Promise.reject())}).catch(function(){throw 'code'})}
if(!S){err('Этот браузер не умеет открывать нашу вселенную 😔<br>Нажми ⋮ или «…» вверху → «Открыть в браузере» (Safari или Chrome).');$('go').disabled=true}
else{try{var sk=localStorage.getItem('nv_k'),sw=localStorage.getItem('nv_w');if(sk&&sw)openWith(b64(sk),sw).catch(fail)}catch(_){}}
$('f').addEventListener('submit',function(e){e.preventDefault();if(!S)return;var v=$('code').value,btn=$('go');if(!norm(v))return;
  btn.disabled=true;btn.textContent='Проверяю…';err('');
  tryCode(v).then(function(r){try{localStorage.setItem('nv_k',ub64(r.raw));localStorage.setItem('nv_w',r.who)}catch(_){}return openWith(r.raw,r.who)})
  .catch(function(x){if(x==='code'){btn.disabled=false;btn.textContent='Открыть ✨';err('Код не подошёл. Проверь буквы и цифры 💛');var b=$('box');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');try{navigator.vibrate&&navigator.vibrate([40,40,40])}catch(_){}}else fail(x)})});
})();
</script>
</body>
</html>
